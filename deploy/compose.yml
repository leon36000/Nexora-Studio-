# Nexora — plateforme complète en une commande :
#   curl -fsSL https://raw.githubusercontent.com/leon36000/Nexora-Studio-/main/install.sh | bash
# ou, depuis les sources : scripts/init-env.sh && docker compose -f deploy/compose.yml up -d --build
# Images : NEXORA_IMAGE_PREFIX (ex. ghcr.io/leon36000/nexora-) et NEXORA_VERSION (ex. latest) ;
# par défaut nexora/<service>:local, construites ici. Ollama sert les embeddings et le modèle local.
# Services : WorkStudio (app, temps réel, migrations), Nexora API, Nexora Connect, PostgreSQL, Redis.
# Les ports sont publiés sur NEXORA_BIND_ADDRESS (127.0.0.1 par défaut : cette machine seulement).
name: nexora

x-workstudio-env: &workstudio-env
  NODE_ENV: production
  DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?run scripts/init-env.sh first}@postgres:5432/nexora
  REDIS_URL: redis://redis:6379
  NEXT_PUBLIC_APP_URL: ${NEXORA_PUBLIC_URL:-http://localhost:3000}
  BETTER_AUTH_URL: ${NEXORA_PUBLIC_URL:-http://localhost:3000}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?run scripts/init-env.sh first}
  INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?run scripts/init-env.sh first}

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/init-env.sh first}
      POSTGRES_DB: nexora
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d nexora']
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--save', '60', '1', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 30

  nexora-api-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--requirepass', '${NEXORA_API_REDIS_PASSWORD:?run scripts/init-env.sh first}', '--save', '60', '1']
    volumes:
      - nexora-api-redis-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 30
    environment:
      REDIS_PASSWORD: ${NEXORA_API_REDIS_PASSWORD}

  nexora-api:
    build:
      context: ../services/nexora-api
      dockerfile: api/Dockerfile
    image: ${NEXORA_IMAGE_PREFIX:-nexora/}api:${NEXORA_VERSION:-local}
    restart: unless-stopped
    environment:
      CONFIG_FILE: /config.yml
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      NEXORA_API_REDIS_PASSWORD: ${NEXORA_API_REDIS_PASSWORD}
      NEXORA_API_SECRET_KEY: ${NEXORA_API_SECRET_KEY:?run scripts/init-env.sh first}
      NEXORA_API_ADMIN_PASSWORD: ${NEXORA_API_ADMIN_PASSWORD:?run scripts/init-env.sh first}
      NEXORA_MODEL_NAME: ${NEXORA_MODEL_NAME:-nexora-default}
      NEXORA_UPSTREAM_URL: ${NEXORA_UPSTREAM_URL:?set the model provider in deploy/.env}
      NEXORA_UPSTREAM_MODEL: ${NEXORA_UPSTREAM_MODEL:?set the model provider in deploy/.env}
      NEXORA_UPSTREAM_KEY: ${NEXORA_UPSTREAM_KEY:-none}
    volumes:
      - ./nexora-api/config.yml:/config.yml:ro
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '${NEXORA_SERVICES_BIND_ADDRESS:-127.0.0.1}:${NEXORA_API_PORT:-8000}:8000'
    depends_on:
      postgres:
        condition: service_healthy
      nexora-api-redis:
        condition: service_healthy
      # A local chat model must be reachable when Nexora API reads its model list at start.
      ollama:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:8000/health']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  nexora-bootstrap:
    image: ${NEXORA_IMAGE_PREFIX:-nexora/}api:${NEXORA_VERSION:-local}
    user: '0:0'
    restart: 'no'
    entrypoint: ['/.venv/bin/python', '/bootstrap-script/bootstrap.py']
    command: []
    environment:
      NEXORA_API_URL: http://nexora-api:8000
      NEXORA_API_ADMIN: admin
      NEXORA_API_ADMIN_PASSWORD: ${NEXORA_API_ADMIN_PASSWORD}
      NEXORA_BOOTSTRAP_FILE: /bootstrap/nexora-api.env
      # Re-applied at every start, so a model changed in deploy/.env takes effect.
      NEXORA_MODEL_NAME: ${NEXORA_MODEL_NAME:-nexora-default}
      NEXORA_UPSTREAM_URL: ${NEXORA_UPSTREAM_URL}
      NEXORA_UPSTREAM_MODEL: ${NEXORA_UPSTREAM_MODEL}
      NEXORA_UPSTREAM_KEY: ${NEXORA_UPSTREAM_KEY:-none}
      NEXORA_BOOTSTRAP_OWNER: '1001:1001'
    volumes:
      - ./bootstrap/bootstrap.py:/bootstrap-script/bootstrap.py:ro
      - bootstrap:/bootstrap
    depends_on:
      nexora-api:
        condition: service_healthy

  nexora-connect:
    build:
      context: ../services/nexora-connect
      dockerfile: docker/Dockerfile
    image: ${NEXORA_IMAGE_PREFIX:-nexora/}connect:${NEXORA_VERSION:-local}
    restart: unless-stopped
    environment:
      NEXORA_CONNECT_ENCRYPTION_KEY: ${NEXORA_CONNECT_ENCRYPTION_KEY:?run scripts/init-env.sh first}
      NEXORA_CONNECT_RUNTIME_TOKEN: ${NEXORA_CONNECT_RUNTIME_TOKEN:?run scripts/init-env.sh first}
      NEXORA_CONNECT_ADMIN_TOKEN: ${NEXORA_CONNECT_ADMIN_TOKEN:?run scripts/init-env.sh first}
      NEXORA_CONNECT_ORIGIN: ${NEXORA_CONNECT_PUBLIC_URL:-http://localhost:${NEXORA_CONNECT_PORT:-8400}}
    volumes:
      - connect-data:/app/data
    ports:
      - '${NEXORA_SERVICES_BIND_ADDRESS:-127.0.0.1}:${NEXORA_CONNECT_PORT:-8400}:3000'

  workstudio-migrations:
    build:
      context: ../workstudio
      dockerfile: docker/db.Dockerfile
    image: ${NEXORA_IMAGE_PREFIX:-nexora/}workstudio-migrations:${NEXORA_VERSION:-local}
    restart: 'no'
    working_dir: /app/packages/db
    command: ['bun', 'run', 'db:migrate']
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/nexora
    depends_on:
      postgres:
        condition: service_healthy

  workstudio-realtime:
    build:
      context: ../workstudio
      dockerfile: docker/realtime.Dockerfile
    image: ${NEXORA_IMAGE_PREFIX:-nexora/}workstudio-realtime:${NEXORA_VERSION:-local}
    restart: unless-stopped
    environment:
      <<: *workstudio-env
    ports:
      - '${NEXORA_BIND_ADDRESS:-127.0.0.1}:${NEXORA_REALTIME_PORT:-3002}:3002'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      workstudio-migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3002/health']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

  workstudio:
    build:
      context: ../workstudio
      dockerfile: docker/app.Dockerfile
    image: ${NEXORA_IMAGE_PREFIX:-nexora/}workstudio:${NEXORA_VERSION:-local}
    restart: unless-stopped
    command: ['/bin/sh', '-c', '. /bootstrap/nexora-api.env && exec bun apps/sim/bootstrap.js']
    environment:
      <<: *workstudio-env
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?run scripts/init-env.sh first}
      API_ENCRYPTION_KEY: ${API_ENCRYPTION_KEY:?run scripts/init-env.sh first}
      CRON_SECRET: ${CRON_SECRET:?run scripts/init-env.sh first}
      SOCKET_SERVER_URL: http://workstudio-realtime:3002
      NEXT_PUBLIC_SOCKET_URL: ${NEXORA_PUBLIC_REALTIME_URL:-http://localhost:${NEXORA_REALTIME_PORT:-3002}}
      NEXT_TELEMETRY_DISABLED: '1'
      NEXORA_TIME_ZONE: ${NEXORA_TIME_ZONE:-Europe/Paris}
      # Models: everything goes through Nexora API (OpenAI-compatible), shown as « Nexora ».
      VLLM_BASE_URL: http://nexora-api:8000/v1
      NEXORA_ONLY_MODELS: 'true'
      NEXORA_DEFAULT_MODEL: ${NEXORA_MODEL_NAME:-nexora-default}
      # Tools: Nexora Connect is preconfigured as an MCP server in every workspace.
      NEXORA_CONNECT_MCP_URL: http://nexora-connect:3000/mcp
      NEXORA_CONNECT_TOKEN: ${NEXORA_CONNECT_RUNTIME_TOKEN}
      EGRESS_ALLOWED_HOSTS: nexora-api,nexora-connect,searxng
      # Governance shipped with Nexora: organizations, audit log, usage dashboard.
      ORGANIZATIONS_ENABLED: 'true'
      NEXT_PUBLIC_ORGANIZATIONS_ENABLED: 'true'
      AUDIT_LOGS_ENABLED: 'true'
      NEXT_PUBLIC_AUDIT_LOGS_ENABLED: 'true'
      USAGE_MONITORING_ENABLED: 'true'
      NEXT_PUBLIC_USAGE_MONITORING_ENABLED: 'true'
      # Upstream features enabled by default on self-hosted that Nexora v1 does not ship
      # (the mailer needs a copilot backend; branding and session policies have no settings UI).
      INBOX_ENABLED: 'false'
      NEXT_PUBLIC_INBOX_ENABLED: 'false'
      WHITELABELING_ENABLED: 'false'
      NEXT_PUBLIC_WHITELABELING_ENABLED: 'false'
      SESSION_POLICIES_ENABLED: 'false'
      NEXT_PUBLIC_SESSION_POLICIES_ENABLED: 'false'
      # One organization per instance: every account joins it as a member, so roles, audit and
      # consumption are governed in one place. Its owner is NEXORA_ORGANIZATION_OWNER_EMAIL, or
      # the first account created. Leave the name empty to let each user found their own.
      # Knowledge bases embed with the local Ollama (no third-party key, 1024 dimensions).
      OLLAMA_URL: http://ollama:11434
      # Web search block, only when the administrator enabled SearXNG.
      SEARXNG_URL: ${NEXORA_SEARXNG_URL:-}
      PREVIEW_BLOCKS: ${NEXORA_PREVIEW_BLOCKS:-}
      KB_EMBEDDING_MODEL: ollama/${NEXORA_EMBED_MODEL:-bge-m3}
      NEXT_PUBLIC_KB_EMBEDDING_MODEL: ollama/${NEXORA_EMBED_MODEL:-bge-m3}
      EMBEDDING_OUTPUT_DIMS: '1024'
      INSTANCE_ORG_NAME: ${NEXORA_ORGANIZATION_NAME:-}
      INSTANCE_ORG_OWNER_EMAIL: ${NEXORA_ORGANIZATION_OWNER_EMAIL:-}
      # Who may create an account: restrict to your email domains, and close sign-ups once the team is in.
      ALLOWED_LOGIN_DOMAINS: ${NEXORA_ALLOWED_EMAIL_DOMAINS:-}
      DISABLE_REGISTRATION: ${NEXORA_REGISTRATION_DISABLED:-false}
      EMAIL_VERIFICATION_ENABLED: ${NEXORA_EMAIL_VERIFICATION:-false}
      # Optional single sign-on (OIDC) and outgoing email.
      NEXT_PUBLIC_NEXORA_OIDC_NAME: ${NEXORA_OIDC_NAME:-}
      NEXORA_OIDC_ISSUER: ${NEXORA_OIDC_ISSUER:-}
      NEXORA_OIDC_CLIENT_ID: ${NEXORA_OIDC_CLIENT_ID:-}
      NEXORA_OIDC_CLIENT_SECRET: ${NEXORA_OIDC_CLIENT_SECRET:-}
      FROM_EMAIL_ADDRESS: ${NEXORA_EMAIL_FROM:-${FROM_EMAIL_ADDRESS:-}}
      SMTP_HOST: ${NEXORA_SMTP_HOST:-}
      SMTP_PORT: ${NEXORA_SMTP_PORT:-}
      SMTP_USER: ${NEXORA_SMTP_USER:-}
      SMTP_PASS: ${NEXORA_SMTP_PASS:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
    volumes:
      - bootstrap:/bootstrap:ro
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '${NEXORA_BIND_ADDRESS:-127.0.0.1}:${NEXORA_WORKSTUDIO_PORT:-3000}:3000'
    depends_on:
      redis:
        condition: service_healthy
      workstudio-migrations:
        condition: service_completed_successfully
      workstudio-realtime:
        condition: service_healthy
      nexora-bootstrap:
        condition: service_completed_successfully
      nexora-connect:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:3000/login']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Background jobs (Sim's scheduler): scheduled workflows, polling triggers (Gmail, Outlook,
  # IMAP), resuming Wait and human-approval blocks, the outbox and knowledge syncs. It only
  # calls WorkStudio's API every minute, authenticated by CRON_SECRET (docker/crontab).
  cron:
    build:
      context: ../workstudio
      dockerfile: docker/cron.Dockerfile
    image: ${NEXORA_IMAGE_PREFIX:-nexora/}cron:${NEXORA_VERSION:-local}
    restart: on-failure
    environment:
      SIM_URL: http://workstudio:3000
      CRON_SECRET: ${CRON_SECRET:?run scripts/init-env.sh first}
      TZ: ${NEXORA_TIME_ZONE:-Europe/Paris}
    depends_on:
      workstudio:
        condition: service_healthy

  # Optional web search (profile « search », off by default): queries leave the instance towards
  # public search engines, so the administrator enables it explicitly (install.sh asks).
  searxng:
    image: searxng/searxng:2026.10.17-1c10abe2d
    profiles: [search]
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${NEXORA_SEARXNG_SECRET:-}
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro

  # Local model server, always present: it serves the knowledge-base embeddings (bge-m3) and,
  # when chosen, the chat model (NEXORA_UPSTREAM_URL=http://ollama:11434). CPU by default.
  ollama:
    image: ollama/ollama:0.12.6
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: 30m
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ['CMD', 'ollama', 'list']
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  ollama-data:
  postgres-data:
  redis-data:
  nexora-api-redis-data:
  connect-data:
  bootstrap:
