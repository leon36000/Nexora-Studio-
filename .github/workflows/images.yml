# Builds the Nexora images for amd64 and arm64 and publishes them to the GitHub Container
# Registry of this repository (ghcr.io/<owner>/nexora-*). Runs on tags v* and on demand.
name: images

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: workstudio
            context: workstudio
            dockerfile: workstudio/docker/app.Dockerfile
          - name: workstudio-realtime
            context: workstudio
            dockerfile: workstudio/docker/realtime.Dockerfile
          - name: workstudio-migrations
            context: workstudio
            dockerfile: workstudio/docker/db.Dockerfile
          - name: api
            context: services/nexora-api
            dockerfile: services/nexora-api/api/Dockerfile
          - name: connect
            context: services/nexora-connect
            dockerfile: services/nexora-connect/docker/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/nexora-${{ matrix.name }}
          tags: |
            type=ref,event=tag
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
