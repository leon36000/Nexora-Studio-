sonar.projectKey=nexora-workstudio
sonar.projectName=Nexora WorkStudio
sonar.sourceEncoding=UTF-8
sonar.sources=workstudio/apps/sim,workstudio/apps/realtime,workstudio/packages,services,scripts,deploy
sonar.exclusions=**/node_modules/**,**/.next/**,**/dist/**,**/coverage/**,**/*.test.ts,**/*.test.tsx,**/*.integration.ts,**/tests/**,**/test_*.py,**/messages/**,**/*.generated.*,**/migrations/meta/**,workstudio/apps/docs/**,workstudio/apps/desktop/**,**/public/**,**/bundles/**,**/*.cjs,**/*.min.js
sonar.tests=workstudio/apps/sim,workstudio/packages,services
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.integration.ts,**/tests/**,**/test_*.py
sonar.test.exclusions=**/node_modules/**
sonar.python.version=3.12
# Le pod CI dispose de 6 Go : l'analyseur JavaScript (Node) et le scanner (Java) doivent y tenir ensemble.
# Peu de projets TypeScript chargés à la fois (les fichiers hors de ceux-ci sont analysés avec une configuration par défaut).
sonar.javascript.node.maxspace=3072
sonar.typescript.tsconfigPaths=workstudio/apps/sim/tsconfig.json,workstudio/apps/realtime/tsconfig.json,services/nexora-connect/src/tsconfig.json,workstudio/packages/db/tsconfig.json
